# Keeps shikhar-research.vercel.app and next-mdx-blog-xi.vercel.app on the same production deployment.
# Add repo secret VERCEL_TOKEN (Vercel → Settings → Tokens).
name: Sync Vercel production aliases

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Sync production aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run deploy:sync-aliases
