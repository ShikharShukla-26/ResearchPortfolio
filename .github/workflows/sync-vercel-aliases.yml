# After Vercel production deploy succeeds, point both *.vercel.app URLs at that deployment.
# Requires repo secret VERCEL_TOKEN — see docs/vercel-auto-sync.md
name: Sync Vercel production aliases

on:
  deployment_status:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip failed/canceled deploy notifications; allow manual + push (push waits in script).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_folaDmDuVQIuuekP8hHelcw2
      VERCEL_PROJECT_ID: prj_44BNm66qJ0MBJWQsBZYo6jeltlDz
      VERCEL_PROJECT: shikhar-research
      GITHUB_SHA: ${{ github.event.deployment.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync production aliases
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping (aliases sync on Vercel build). See docs/SETUP-AUTO-SYNC.md"
            exit 0
          fi
          npm run deploy:sync-aliases
